      } catch (e) {
        window.addEventListener('DOMContentLoaded', init);
      }

    function init() {

    function fetchAllData() {
      var refreshBtn = document.getElementById("refreshBtn");
      var refreshText = document.getElementById("refreshBtnText");
      var refreshIcon = document.getElementById("refreshIcon");
      if (refreshBtn) {
        refreshBtn.disabled = true;
        if (refreshText) refreshText.innerText = "重新整理中...";
        if (refreshIcon) refreshIcon.classList.add("animate-spin");
      }
      fetchProductData();
      setTimeout(function() {
        if (refreshBtn) {
          refreshBtn.disabled = false;
          if (refreshText) refreshText.innerText = "重新整理";
          if (refreshIcon) refreshIcon.classList.remove("animate-spin");
        }
        showToast("✅ 已成功重新整理最新商品！");
      }, 700);

    // ========== 最新消息區塊（Table 形式，串聯 Google 試算表） ==========
    function getNewsColumnOffset(firstValue, secondValue) {
      var first = String(firstValue || '').trim().toLowerCase();
      var second = String(secondValue || '').trim().toLowerCase();
      var isTimestamp = first === '時間戳記' || first === 'timestamp';
      var secondIsId = second === 'id' || second === '編號';
      return isTimestamp || secondIsId ? 1 : 0;
    }

    function fetchNewsData() {
      var baseUrl =
        'https://docs.google.com/spreadsheets/d/' +
        SHEET_ID +
        '/gviz/tq?sheet=' +
        encodeURIComponent(SHEET_NAME_NEWS);

      if (typeof google !== 'undefined' && google.visualization && google.visualization.Query) {
        try {
          var query = new google.visualization.Query(baseUrl);
          query.setQuery('select *');
          query.send(function(response) {
            if (response && !response.isError()) {
              var data = response.getDataTable();
              if (data && data.getNumberOfRows() > 0) {
                parseNewsDataTable(data);
                return;
              }
            }
            fetchNewsViaDirectApi(baseUrl + '&tqx=out:json');
          });
          return;
        } catch (e) {
          console.warn("GViz news query error:", e);
        }
      }

      fetchNewsViaDirectApi(baseUrl + '&tqx=out:json');
    }

    function fetchNewsViaDirectApi(url) {
      fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function(text) {
          var startIdx = text.indexOf('{');
          var endIdx = text.lastIndexOf('}') + 1;
          if (startIdx === -1 || endIdx <= startIdx) throw new Error("Format error");
          var json = JSON.parse(text.substring(startIdx, endIdx));
          var rows = json.table.rows;
          allNews = [];

          var columns = json.table.cols || [];
          var columnOffset = getNewsColumnOffset(
            columns[0] ? columns[0].label : '',
            columns[1] ? columns[1].label : ''
          );
          var startIndex = 0;

          for (var i = startIndex; i < rows.length; i++) {
            var c = rows[i].c;
            if (!c) continue;
            var id = c[columnOffset] ? c[columnOffset].v : (i + 1);
            var title = c[columnOffset + 1] ? String(c[columnOffset + 1].v) : '';
            var date = c[columnOffset + 2] ? String(c[columnOffset + 2].f || c[columnOffset + 2].v) : '';
            var content = c[columnOffset + 3] ? String(c[columnOffset + 3].v) : '';
            var link = c[columnOffset + 4] ? String(c[columnOffset + 4].v) : '';
            var img = c[columnOffset + 5] ? String(c[columnOffset + 5].v) : '';

            if (!title) continue;

            allNews.push({
              id: id,
              title: title,
              date: date,
              content: content,
              link: link,
              img: img || 'https://picsum.photos/seed/news' + id + '/200/120'
            });
          }

          if (allNews.length > 0) {
            renderNewsTable(allNews);
          } else {
            allNews = DEFAULT_NEWS;
            renderNewsTable(allNews);
          }
        })
        .catch(function(err) {
          console.warn("最新消息 Google 試算表尚未建立該分頁，載入預設 12 筆消息資料：", err);
          allNews = DEFAULT_NEWS;
          renderNewsTable(allNews);
        });
    }

    function parseNewsDataTable(data) {
      var rows = data.getNumberOfRows();
      allNews = [];

      var columnOffset = getNewsColumnOffset(data.getColumnLabel(0), data.getColumnLabel(1));
      var startIndex = 0;
      if (rows > 0 && ['id', '編號'].indexOf(String(data.getFormattedValue(0, columnOffset)).trim().toLowerCase()) !== -1) {
        startIndex = 1;
      }

      for (var r = startIndex; r < rows; r++) {
        var id = data.getFormattedValue(r, columnOffset);
        var title = data.getFormattedValue(r, columnOffset + 1);
        var date = data.getFormattedValue(r, columnOffset + 2);
        var content = data.getFormattedValue(r, columnOffset + 3);
        var link = data.getFormattedValue(r, columnOffset + 4);
        var img = data.getFormattedValue(r, columnOffset + 5);

        if (!title) continue;

        allNews.push({
          id: id,
          title: title,
          date: date,
          content: content,
          link: link,
          img: img || 'https://picsum.photos/seed/news' + id + '/200/120'
        });
      }

      if (allNews.length > 0) {
        renderNewsTable(allNews);
      } else {
        allNews = DEFAULT_NEWS;
        renderNewsTable(allNews);
      }
    }

    function sortNewsByIdDescending(newsList) {
      newsList.sort(function(a, b) {
        return Number(b.id) - Number(a.id);
      });
      return newsList;
    }

    // 渲染首頁最新消息（只有一條，點擊查看訊息跳轉至新頁面展示 12 則公告）
    function renderNewsTable(newsList) {
      if (!newsList || newsList.length === 0) return;
      sortNewsByIdDescending(newsList);
      var latest = newsList[0];
      var dateEl = document.getElementById("singleNewsDate");
      var titleEl = document.getElementById("singleNewsTitle");
      var descEl = document.getElementById("singleNewsDesc");

      if (dateEl) dateEl.innerText = latest.date || "";
      if (titleEl) titleEl.innerText = latest.title || "";
      if (descEl) descEl.innerText = latest.content ? "- " + latest.content : "";
    }

    // 跳轉至最新消息專屬新頁面 (展示 12 則公告)
    function goToNewsPage() {
      window.location.href = "detail.html?type=news";
    }

      var alertBox = document.getElementById("errorAlert");
      if (alertBox) alertBox.classList.add("hidden");
      document.getElementById("productList").innerHTML = "";

      var baseUrl =

        '/gviz/tq?sheet=' +
        encodeURIComponent(SHEET_NAME_PRODUCTS);

      if (typeof google !== 'undefined' && google.visualization && google.visualization.Query) {
        try {
          var query = new google.visualization.Query(baseUrl);
          query.setQuery('select *');
          query.send(function(response) {
            if (response && !response.isError()) {
              parseDataTable(response.getDataTable());
            } else {
              fetchViaDirectApi(baseUrl + '&tqx=out:json');
            }
          });
          return;
        } catch (err) {
          console.warn("GViz query execution failed, trying direct fetch:", err);
        }
      }

      fetchViaDirectApi(baseUrl + '&tqx=out:json');
    }

    function parseDataTable(data) {
      hideLoading();
      var rows = data.getNumberOfRows();
      allProducts = [];

      var startIndex = 0;
      if (rows > 0) {
        var firstCell = String(data.getFormattedValue(0, 0) || '').toLowerCase().trim();
        if (firstCell === 'id' || firstCell === '編號') {
          startIndex = 1;
        }
      }

      for (var r = startIndex; r < rows; r++) {
        var id    = data.getFormattedValue(r, 0);
        var name  = data.getFormattedValue(r, 1);
        var desc  = data.getFormattedValue(r, 2);
        var rawPrice = data.getFormattedValue(r, 3);
        var img   = data.getFormattedValue(r, 4);

        if (!id) continue;

        var numPrice = Number(String(rawPrice).replace(/[^0-9.]/g, ''));
        var formattedPrice = !isNaN(numPrice) && numPrice > 0 ? numPrice.toLocaleString() : (rawPrice || "0");
        var finalImg = (img && img.indexOf('picsum.photos') === -1) ? img : (LATEST_IMAGES[id] || img);

        allProducts.push({
          id: id,
          name: name || id,
          desc: desc || "尚無商品說明",
          price: formattedPrice,
          img: finalImg
        });
      }

      renderFilteredCards(allProducts);
    }

    function fetchViaDirectApi() {
      fetchProductsViaJsonp(function(err, list) {
        hideLoading();
        if (!err && list && list.length > 0) {
          allProducts = list;
        } else {
          allProducts = [];
        }
        renderFilteredCards(allProducts);
      });
    }

    function fetchProductsViaJsonp(callback) {
      var cbName = 'gviz_products_cb_' + Date.now();
      var timeout = null;
      var finished = false;

      window[cbName] = function(json) {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        cleanup();
        var list = [];
        if (json && json.status === 'ok' && json.table && json.table.rows) {
          var rows = json.table.rows;
          var start = (rows.length > 0 && rows[0].c && rows[0].c[0] && String(rows[0].c[0].v).toLowerCase() === 'id') ? 1 : 0;
          for (var i = start; i < rows.length; i++) {
            var c = rows[i].c;
            if (!c) continue;
            var id = String(c[0] ? c[0].v : '').trim();
            var name = String(c[1] ? c[1].v : '').trim();
            var desc = String(c[2] ? c[2].v : '').trim();
            var rawPrice = c[3] ? (c[3].f || c[3].v) : '0';
            var img = String(c[4] ? c[4].v : '').trim();
            if (!id) continue;
            var numPrice = Number(String(rawPrice).replace(/[^0-9.]/g, ''));
            var formattedPrice = !isNaN(numPrice) && numPrice > 0 ? numPrice.toLocaleString() : (rawPrice || "0");
            var finalImg = (img && img.indexOf('picsum.photos') === -1) ? img : (LATEST_IMAGES[id] || img);
            list.push({ id: id, name: name || id, desc: desc || "尚無商品說明", price: formattedPrice, img: finalImg });
          }
        }
        callback(null, list);
      };

      function cleanup() {
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      var script = document.createElement('script');
      script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(SHEET_NAME_PRODUCTS) + '&tqx=responseHandler:' + cbName + '&_t=' + Date.now();
      script.onerror = function() {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        cleanup();
        callback(new Error('Connection error'));
      };
      timeout = setTimeout(function() {
        if (finished) return;
        finished = true;
        cleanup();
        callback(new Error('Timeout'));
      }, 6000);
      document.head.appendChild(script);
    }

    function hideLoading() {
      var spinner = document.getElementById("loadingSpinner");
      if (spinner) spinner.classList.add("hidden");
    }

    function renderFilteredCards(products) {
      document.getElementById("productCountText").innerText = "共載入 " + products.length + " 項商品";
      var container = document.getElementById("productList");

      if (products.length === 0) {
        container.innerHTML =
          '<div class="col-span-full text-center py-12 bg-base-100 rounded-2xl">' +
            '<p class="text-slate-400 text-sm">找不到符合條件的商品項目</p>' +
          '</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < products.length; i++) {
        var p = products[i];

        html +=
          '<div class="card bg-base-100 shadow-sm hover:shadow-xl transition-all duration-300 border border-base-300 flex flex-col justify-between overflow-hidden group">' +
            '<figure class="card-img-container relative">' +
              '<img src="' + p.img + '" alt="' + p.name + '" onerror="this.src=\'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=800&auto=format&fit=crop&q=80\'" />' +
              '<div class="absolute top-2 left-2 badge badge-neutral text-xs font-mono font-bold shadow">' +
                p.id +
              '</div>' +
            '</figure>' +
            '<div class="card-body p-5 flex flex-col justify-between flex-1">' +
              '<div>' +
                '<h2 class="card-title text-base font-bold text-slate-900 group-hover:text-primary transition-colors line-clamp-1 mb-1">' +
                  p.name +
                '</h2>' +
                '<p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-3">' +
                  p.desc +
                '</p>' +
              '</div>' +
              '<div class="pt-3 border-t border-base-200 flex items-center justify-between">' +
                '<div>' +
                  '<span class="text-[10px] text-slate-400 block font-medium">售價 NT$</span>' +
                  '<span class="text-lg font-black text-primary">$' + p.price + '</span>' +
                '</div>' +
                '<div class="card-actions">' +
                  '<a href="detail.html?id=' + encodeURIComponent(p.id) + '" class="btn btn-primary btn-sm text-xs font-semibold">' +
                    '查看詳細' +
                  '</a>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

      container.innerHTML = html;
    }

    function handleSearch() {
      var query = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!query) {
        renderFilteredCards(allProducts);
        return;
      }

      var filtered = allProducts.filter(function(p) {
        return (
          p.id.toLowerCase().indexOf(query) !== -1 ||
          p.name.toLowerCase().indexOf(query) !== -1 ||
          p.desc.toLowerCase().indexOf(query) !== -1
        );
      });

      renderFilteredCards(filtered);
    }

    function showToast(msg) {
      var toast = document.getElementById("toastNotification");
      var toastMsg = document.getElementById("toastMessage");
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.remove("hidden");
        setTimeout(function() {
          toast.classList.add("hidden");
        }, 2500);
      }
    }
  </script>

  <!-- 提示訊息 Toast -->
  <div id="toastNotification" class="toast toast-end hidden z-50">
    <div class="alert alert-success text-white text-xs shadow-lg">
      <span id="toastMessage">已完成！</span>
    </div>
  </div>

</body>
</html>
